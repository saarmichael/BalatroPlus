impl_notes: "Copy rule (D23, adjusted): target '+' joker and blueprint_compat -> copy it; target vanilla whose '+' version is carpenter_compat and blueprint_compat -> run the target's '+' ability on it with context.blueprint set (BPlus.plus_calculate, stored values via state_transfer, no state change); otherwise target blueprint_compat (vanilla rule, e.g. Popcorn, Gros Michel) -> copy its regular ability; else incompatible. Implemented in BPlus.copy_plus (j_bplus_blueprint_plus.lua): mode(), effect(). Chains/cycles end through the context.blueprint count like SMODS.blueprint_effect. Compat UI and JokerDisplay follow the same rule (a vanilla target shows its '+' display via a proxy). The Rust makes it vanilla Blueprint/Brainstorm. carpenter_compat = true: the '+' can run on vanilla Blueprint/Brainstorm (then it copies from the Blueprint's position). Target: the joker to the right."
acceptance_tests:
