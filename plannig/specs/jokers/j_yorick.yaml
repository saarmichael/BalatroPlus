impl_notes: "Like vanilla Yorick with a 14-card period: context.discard (not blueprint): first normalise extra.discards_left = ((extra.discards_left - 1) % extra.discards) + 1, then if it is <= 1: reset to extra.discards and extra.Xmult += extra.Xmult_mod, else extra.discards_left -= 1. Score extra.Xmult in context.joker_main when > 1. Upgrade (growing): XMult carries over; the counter is copied as is and normalised to the new period by the step above (17 of 23 remaining -> 3 of 14). Carpenter: same rule both ways, the counter is normalised to whichever period is active (23 when Carpenter leaves). Vanilla keeps them in ability.x_mult and ability.yorick_discards."
