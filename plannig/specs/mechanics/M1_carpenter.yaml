# Implementation ticket for mechanic M1 Carpenter (decision D22 in plannig/DECISIONS.md; supersedes D12).
id: "M1"
name: "Carpenter"
kind: "joker (not a '+' joker: it has no '+' version and is never eligible)"
file: "mod/src/mechanics/M1_carpenter.lua"
key: "j_bplus_carpenter"
numbers:
  rarity: "BPlus.balance.carpenter.rarity   # 2 = Uncommon"
  cost: "BPlus.balance.carpenter.cost       # $8"
  blueprint_compat: false
behavior: >
  Sell effect. The game remembers the last Joker sold in G.GAME.bplus_last_sold (center key), set when the
  player sells any Joker except Carpenter (hook on Card:sell_card, so it works with no Carpenter held; Carpenter
  may be bought after the sale). The record is saved with the run and survives shops and rounds.
  Selling Carpenter creates the '+' version of the recorded Joker (the key itself if it is already '+') as a
  fresh card via SMODS.add_card: starting '+' values (no state transfer), no edition, no stickers. The record
  is then cleared (consumed). Carpenter is not a behaviour provider: no '+' badge, no neighbour switching, no
  compatible/incompatible text.
  Tooltip: "Sell this card to create the upgraded version of the last Joker sold (Currently: <name> / none)".
  JokerDisplay: reminder "(<'+' joker name>)" or "(none)".
edge_cases:
  - "No record -> message 'Nothing to build', nothing created."
  - "Recorded joker has no '+' version (e.g. Four Fingers) -> message, nothing created, record kept."
  - "No room (Negative Carpenter while slots are full) -> 'No room!', nothing created, record kept."
  - "Carpenter is never recorded as the last sold joker."
  - "Sold joker was Foil / had stickers / had a grown value -> the created '+' joker is fresh."
  - "Second Carpenter after use does nothing until another joker is sold."
  - "The Rust does not interact with Carpenter."
acceptance_tests:
  - "Human example: Joker held, Carpenter in the shop: sell Joker, buy Carpenter, sell Carpenter -> Joker+ added"
  - "Created Joker+ scores +20 Mult"
  - "Last sold is a '+' joker -> fresh '+' joker back"
  - "Record consumed: second Carpenter gives nothing"
  - "Carpenter itself not recorded"
  - "No record -> nothing"
  - "Joker without '+' version -> nothing, record kept"
  - "No edition even if the sold joker was Foil; no stickers"
  - "Grown Ride the Bus (5) -> Express Bus starts at 0"
  - "Record survives shop/round transitions"
  - "Last sold = most recent"
  - "No room -> nothing, record kept"
  - "Carpenter never eligible for upgrade; no behaviour switching on neighbours"
  - "Tooltip and JokerDisplay show the target or none"
